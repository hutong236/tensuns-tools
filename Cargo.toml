[package]
name = "tensuns-cli"
version = "3.0.0"
edition = "2021"
rust-version = "1.85"

[[bin]]
name = "tensuns"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
csv = "1.3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rpassword = "7.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.15"
zeroize = "1.8"

[profile.release]
lto = "thin"
strip = true
